ontology:
  product_id: STUDENT-VISA
  spec_version: '0.2'
  spec_date: '2026-11-17'
  layers:
  - layer: Authority
    node_types:
    - AuthoritySource
    - InstrumentVersion
    purpose: Source authority, hierarchy and temporal validity.
  - layer: Provision
    node_types:
    - Part
    - Section
    - Subsection
    - Regulation
    - Clause
    - Instruction
    purpose: Exact addressable source text and parent-child structure.
  - layer: Rule
    node_types:
    - BusinessRule
    - EligibilityRule
    - Obligation
    - Prohibition
    - Permission
    - Definition
    - Calculation
    purpose: Atomic regulatory or policy propositions.
  - layer: Qualifier
    node_types:
    - Condition
    - Exception
    - Threshold
    - TemporalConstraint
    - Discretion
    - Trigger
    purpose: Independently queryable rule logic.
  - layer: Domain
    node_types:
    - Visa
    - Applicant
    - Application
    - Provider
    - Programme
    - Sponsor
    - Guardian
    - ImmigrationOfficer
    purpose: Student Visa business concepts.
  - layer: Evidence
    node_types:
    - EvidenceRequirement
    - EvidenceItem
    - ObservedFact
    - VerifiedFact
    purpose: Separates documents/data from accepted decision facts.
  - layer: Decision
    node_types:
    - DecisionCheck
    - RuleEvaluation
    - DecisionOutcome
    - Explanation
    purpose: Controlled execution and auditable outcomes.
  - layer: Lifecycle
    node_types:
    - State
    - StateTransition
    purpose: Application and visa state changes.
  - layer: Governance
    node_types:
    - CoverageGap
    - InterpretationFlag
    - TestCase
    purpose: Safe stopping, change control and assurance.
  graph_path: EvidenceItem -> ObservedFact -> VerifiedFact -> DecisionCheck -> RuleEvaluation
  explanation_chain: RuleEvaluation -> DecisionCheck -> Rule -> Provision -> Instrument
graph_profile:
  principle: Use the smallest set of node types and relationships that answers staff questions. Do not create nodes
    that only restate text or a single value held elsewhere; store it as a property. Keep nodes with no relationships
    in the JSON files only.
  node_labels:
  - Authority
  - AuthoritySource
  - InstrumentVersion
  - Provision
  - Section
  - Subsection
  - Paragraph
  - Regulation
  - Clause
  - Instruction
  - Rule
  - Obligation
  - Prohibition
  - Permission
  - Definition
  - BusinessRule
  - EligibilityRule
  - Calculation
  - Qualifier
  - Condition
  - Exception
  - Threshold
  - TemporalConstraint
  - Discretion
  - Trigger
  - Domain
  - Visa
  - Applicant
  - Application
  - Provider
  - Programme
  - Sponsor
  - Guardian
  - ImmigrationOfficer
  - Evidence
  - EvidenceRequirement
  - EvidenceItem
  - ObservedFact
  - VerifiedFact
  - Decision
  - DecisionCheck
  - RuleEvaluation
  - DecisionOutcome
  - Explanation
  - Lifecycle
  - State
  - StateTransition
  - Governance
  - CoverageGap
  - InterpretationFlag
  - TestCase
  - LoadLog
  relationship_types:
  - MADE_UNDER
  - CONTAINS
  - PARENT_OF
  - REFERENCES
  - SUPERSEDES
  - DERIVED_FROM
  - APPLIES_TO
  - IMPOSES_OBLIGATION_ON
  - PROHIBITS
  - PERMITS
  - HAS_CONDITION
  - HAS_EXCEPTION
  - HAS_THRESHOLD
  - HAS_TIME_CONSTRAINT
  - HAS_DISCRETION
  - REQUIRES_EVIDENCE
  - SUPPORTS_FACT
  - VERIFIED_AS
  - INPUT_TO
  - EVALUATES
  - PRODUCES_OUTCOME
  - CAUSES_TRANSITION
  - EXPLAINED_BY
  not_used:
    node_labels:
    - Part
    relationship_types:
    - AMENDS
    reason: In the spec vocabulary but nothing in the corpus needs them; add only when a source does.
  assessment_pattern: One RuleEvaluation per evaluated rule (result and explanation as properties); one DecisionOutcome
    and one Explanation per assessment; facts link to the DecisionCheck with the evaluation_id on the relationship.

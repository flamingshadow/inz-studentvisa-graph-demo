<svg xmlns="http://www.w3.org/2000/svg" width="680" height="690" viewBox="0 0 680 690" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Student Visa agent to Neo4j architecture</title>
<desc>User and Claude agent call an MCP server with 21 read tools and one write tool. Reads go through fixed Cypher queries, the write goes through the decision engine, both reaching Neo4j. An offline ingestion pipeline loads the spec graph.</desc>
<style>
:root{--bg:#fff;--ln:#5F5E5A;--bd:#B4B2A9;--gray-f:#F1EFE8;--gray-s:#5F5E5A;--gray-t:#444441;--gray-u:#5F5E5A;--pur-f:#EEEDFE;--pur-s:#534AB7;--pur-t:#3C3489;--pur-u:#534AB7;--cor-f:#FAECE7;--cor-s:#993C1D;--cor-t:#712B13;--cor-u:#993C1D;--tea-f:#E1F5EE;--tea-s:#0F6E56;--tea-t:#085041;--tea-u:#0F6E56}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--ln:#B4B2A9;--bd:#5F5E5A;--gray-f:#444441;--gray-s:#B4B2A9;--gray-t:#F1EFE8;--gray-u:#D3D1C7;--pur-f:#3C3489;--pur-s:#AFA9EC;--pur-t:#CECBF6;--pur-u:#AFA9EC;--cor-f:#712B13;--cor-s:#F0997B;--cor-t:#F5C4B3;--cor-u:#F0997B;--tea-f:#085041;--tea-s:#5DCAA5;--tea-t:#9FE1CB;--tea-u:#5DCAA5}}
.bg{fill:var(--bg)}
.arr{stroke:var(--ln);stroke-width:1.5;fill:none}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.gray rect{fill:var(--gray-f);stroke:var(--gray-s)}.gray .th{fill:var(--gray-t)}.gray .ts{fill:var(--gray-u)}
.pur rect{fill:var(--pur-f);stroke:var(--pur-s)}.pur .th{fill:var(--pur-t)}.pur .ts{fill:var(--pur-u)}
.cor rect{fill:var(--cor-f);stroke:var(--cor-s)}.cor .th{fill:var(--cor-t)}.cor .ts{fill:var(--cor-u)}
.tea rect{fill:var(--tea-f);stroke:var(--tea-s)}.tea .th{fill:var(--tea-t)}.tea .ts{fill:var(--tea-u)}
.lbl{fill:var(--gray-t)}
rect{stroke-width:.5}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="690" style="stroke:none"/>
<g class="gray"><rect x="110" y="20" width="200" height="56" rx="8"/><text class="th" x="210" y="38" text-anchor="middle" dominant-baseline="central">User</text><text class="ts" x="210" y="58" text-anchor="middle" dominant-baseline="central">Claude Desktop chat</text></g>
<g class="pur"><rect x="370" y="20" width="200" height="56" rx="8"/><text class="th" x="470" y="38" text-anchor="middle" dominant-baseline="central">Claude agent</text><text class="ts" x="470" y="58" text-anchor="middle" dominant-baseline="central">Agent contract A1 to A5</text></g>
<line x1="310" y1="48" x2="366" y2="48" class="arr" marker-end="url(#arrow)"/>
<line x1="470" y1="76" x2="470" y2="106" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="110" width="600" height="116" rx="12" fill="none" stroke="var(--bd)" stroke-dasharray="5 4"/>
<text class="th lbl" x="56" y="130">MCP server, stdio (svkg mcp)</text>
<g class="pur"><rect x="60" y="150" width="270" height="56" rx="8"/><text class="th" x="195" y="168" text-anchor="middle" dominant-baseline="central">21 read-only tools</text><text class="ts" x="195" y="188" text-anchor="middle" dominant-baseline="central">Search, rules, evidence, gaps</text></g>
<g class="cor"><rect x="350" y="150" width="270" height="56" rx="8"/><text class="th" x="485" y="168" text-anchor="middle" dominant-baseline="central">assess_application</text><text class="ts" x="485" y="188" text-anchor="middle" dominant-baseline="central">The only writing tool</text></g>
<line x1="195" y1="226" x2="195" y2="266" class="arr" marker-end="url(#arrow)"/>
<line x1="485" y1="226" x2="485" y2="266" class="arr" style="stroke:#D85A30" marker-end="url(#arrow)"/>
<g class="pur"><rect x="60" y="270" width="270" height="56" rx="8"/><text class="th" x="195" y="288" text-anchor="middle" dominant-baseline="central">queries.py</text><text class="ts" x="195" y="308" text-anchor="middle" dominant-baseline="central">Fixed Cypher, READ session</text></g>
<g class="cor"><rect x="350" y="270" width="270" height="56" rx="8"/><text class="th" x="485" y="288" text-anchor="middle" dominant-baseline="central">engine + record</text><text class="ts" x="485" y="308" text-anchor="middle" dominant-baseline="central">A1 to A5 checks, write result</text></g>
<line x1="195" y1="326" x2="195" y2="366" class="arr" marker-end="url(#arrow)"/>
<line x1="485" y1="326" x2="485" y2="366" class="arr" style="stroke:#D85A30" marker-end="url(#arrow)"/>
<g class="tea"><rect x="40" y="370" width="600" height="120" rx="12"/><text class="th" x="56" y="392">Neo4j, database studentvisa</text><text class="ts" x="624" y="392" text-anchor="end">bolt://localhost:7687</text></g>
<g class="gray"><rect x="60" y="412" width="270" height="56" rx="8"/><text class="th" x="195" y="430" text-anchor="middle" dominant-baseline="central">SPEC graph</text><text class="ts" x="195" y="450" text-anchor="middle" dominant-baseline="central">Rules, provisions, evidence</text></g>
<g class="gray"><rect x="350" y="412" width="270" height="56" rx="8"/><text class="th" x="485" y="430" text-anchor="middle" dominant-baseline="central">ASSESSMENT nodes</text><text class="ts" x="485" y="450" text-anchor="middle" dominant-baseline="central">Evaluations, outcomes</text></g>
<rect x="40" y="530" width="600" height="92" rx="12" fill="none" stroke="var(--bd)" stroke-dasharray="5 4"/>
<text class="th lbl" x="56" y="550">Offline ingestion (svkg build)</text>
<g class="gray"><rect x="55" y="566" width="125" height="44" rx="8"/><text class="th" x="117" y="580" text-anchor="middle" dominant-baseline="central">Sources</text><text class="ts" x="117" y="597" text-anchor="middle" dominant-baseline="central">Law, manual, spec</text></g>
<g class="gray"><rect x="200" y="566" width="125" height="44" rx="8"/><text class="th" x="262" y="580" text-anchor="middle" dominant-baseline="central">extract</text><text class="ts" x="262" y="597" text-anchor="middle" dominant-baseline="central">Parse to JSON</text></g>
<g class="gray"><rect x="345" y="566" width="125" height="44" rx="8"/><text class="th" x="407" y="580" text-anchor="middle" dominant-baseline="central">check</text><text class="ts" x="407" y="597" text-anchor="middle" dominant-baseline="central">Diff against spec</text></g>
<g class="gray"><rect x="490" y="566" width="125" height="44" rx="8"/><text class="th" x="552" y="580" text-anchor="middle" dominant-baseline="central">load</text><text class="ts" x="552" y="597" text-anchor="middle" dominant-baseline="central">MERGE by id</text></g>
<line x1="180" y1="588" x2="198" y2="588" class="arr" marker-end="url(#arrow)"/>
<line x1="325" y1="588" x2="343" y2="588" class="arr" marker-end="url(#arrow)"/>
<line x1="470" y1="588" x2="488" y2="588" class="arr" marker-end="url(#arrow)"/>
<line x1="552" y1="566" x2="552" y2="494" class="arr" style="stroke-dasharray:5 4" marker-end="url(#arrow)"/>
<line x1="56" y1="650" x2="86" y2="650" class="arr"/><text class="ts lbl" x="94" y="654">Read path</text>
<line x1="190" y1="650" x2="220" y2="650" class="arr" style="stroke:#D85A30"/><text class="ts lbl" x="228" y="654">Write path</text>
<line x1="330" y1="650" x2="360" y2="650" class="arr" style="stroke:#888780;stroke-dasharray:5 4"/><text class="ts lbl" x="368" y="654">Ingestion</text>
<text class="ts lbl" x="450" y="654">POC only, not a visa decision</text>
</svg>

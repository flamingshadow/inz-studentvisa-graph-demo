[project]
name = "svkg"
version = "0.2.0"
description = "Student Visa Knowledge Graph POC (spec v0.2, 17 Nov 2026). Synthetic data only; not a production decision tool."
requires-python = ">=3.11"
dependencies = ["neo4j>=5", "python-docx>=1.1", "pyyaml>=6", "pydantic>=2", "requests>=2", "beautifulsoup4>=4.12", "mcp>=2.3,<3", "python-dotenv>=1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
svkg = "svkg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["svkg", "svkg.dashboard"]

[tool.setuptools.package-data]
"svkg.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["neo4j: needs the live studentvisa database"]
